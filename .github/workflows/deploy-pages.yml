name: Deploy policy pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: '1'
      VITE_GITHUB_PAGES: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Prepare GitHub Pages paths
        run: |
          # vinext writes assetPrefix under a matching directory; GitHub Pages
          # already mounts the artifact at /etmf-king-policies, so move the
          # generated asset directory to the artifact root to avoid duplication.
          mv dist/client/etmf-king-policies/_next dist/client/_next
          rmdir dist/client/etmf-king-policies
          for page in privacy terms recognition-quality; do
            mkdir -p "dist/client/$page"
            mv "dist/client/$page.html" "dist/client/$page/index.html"
          done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
